name: Build & Publish Android Release Update

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (e.g. 1.0.3)'
        required: true
      build_number:
        description: 'Optional integer Android versionCode (auto-increments if blank)'
        required: false
        default: ''
      release_title:
        description: 'Short title shown in Update Center'
        required: true
        default: 'Security, Auth, M-PESA/Fuliza & Compliance Update'
      release_notes:
        description: 'Release changelog shown to users'
        required: true
        default: 'Redesigned auth UX with scoped feedback, accurate Fuliza overdraft & recovery correlation, Kenya DPA Privacy Center, and security hardening.'
      is_mandatory:
        description: 'Require users to update'
        type: boolean
        default: false
      build_aab:
        description: 'Also build signed Android App Bundle (.aab) for Google Play Console'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required release secrets upfront
        env:
          CHECK_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          CHECK_ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CHECK_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'EOF'
          const missing = [];
          if (!process.env.CHECK_URL) missing.push('EXPO_PUBLIC_SUPABASE_URL');
          if (!process.env.CHECK_ANON) missing.push('EXPO_PUBLIC_SUPABASE_ANON_KEY');
          if (!process.env.CHECK_SERVICE) missing.push('SUPABASE_SERVICE_ROLE_KEY');
          if (missing.length > 0) {
            console.error('Missing required GitHub Repository Secrets: ' + missing.join(', '));
            console.error('Add them under Repo Settings -> Secrets and variables -> Actions.');
            process.exit(1);
          }
          console.log('All required Supabase release secrets verified.');
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve and synchronize release version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build_number }}
          INPUT_TITLE: ${{ inputs.release_title }}
          INPUT_NOTES: ${{ inputs.release_notes }}
          INPUT_MANDATORY: ${{ inputs.is_mandatory }}
          INPUT_AAB: ${{ inputs.build_aab }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const isDispatch = process.env.EVENT_NAME === 'workflow_dispatch';
          const version = (isDispatch ? process.env.INPUT_VERSION : process.env.REF_NAME).replace(/^v/i, '').trim();
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.error('Invalid semantic version:', version);
            process.exit(1);
          }
          const title = isDispatch && process.env.INPUT_TITLE ? process.env.INPUT_TITLE : 'XpenseTracker v' + version;
          const notes = isDispatch && process.env.INPUT_NOTES ? process.env.INPUT_NOTES : 'Release v' + version;
          const mandatory = isDispatch ? String(process.env.INPUT_MANDATORY === 'true') : 'false';
          const buildAab = isDispatch ? String(process.env.INPUT_AAB !== 'false') : 'true';
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, 'version=' + version + '\n');
          fs.appendFileSync(out, 'title=' + title.replace(/[\r\n]+/g, ' ') + '\n');
          fs.appendFileSync(out, 'notes=' + notes.replace(/[\r\n]+/g, ' ') + '\n');
          fs.appendFileSync(out, 'mandatory=' + mandatory + '\n');
          fs.appendFileSync(out, 'build_aab=' + buildAab + '\n');
          EOF
          node scripts/sync-version.mjs "${{ steps.meta.outputs.version }}" "${{ inputs.build_number }}"
          BUILD_CODE=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          echo "build_code=$BUILD_CODE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck & automated tests
        run: |
          npm run typecheck
          npm test

      - name: Android manifest security guard
        run: |
          node <<'EOF'
          const fs = require('fs');
          const manifest = fs.readFileSync('android/app/src/main/AndroidManifest.xml', 'utf8');
          if (/RECORD_AUDIO|SYSTEM_ALERT_WINDOW/.test(manifest)) {
            console.error('Blocked unused sensitive permission in main AndroidManifest.xml');
            process.exit(1);
          }
          EOF

      - name: Create .env for production bundle
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Decode Android upload keystore (optional override)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "Decoded custom upload keystore from ANDROID_KEYSTORE_BASE64."
          else
            echo "Using repository release.keystore."
          fi

      - name: Build signed Release APK
        working-directory: android
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'xpensetracker' }} \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || 'xpensetracker' }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'xpensetracker' }}

      - name: Build signed Release AAB (Google Play Bundle)
        if: steps.meta.outputs.build_aab == 'true'
        working-directory: android
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          ./gradlew bundleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'xpensetracker' }} \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || 'xpensetracker' }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'xpensetracker' }}

      - name: Package release artifacts & checksums
        id: pkg
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APK_FILE="XpenseTracker-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/XpenseTracker.apk "$APK_FILE"
          sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
          AAB_SRC=$(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -n 1 || true)
          if [ -n "$AAB_SRC" ] && [ -f "$AAB_SRC" ]; then
            AAB_FILE="XpenseTracker-v${VERSION}.aab"
            cp "$AAB_SRC" "$AAB_FILE"
            sha256sum "$AAB_FILE" > "${AAB_FILE}.sha256"
          fi
          echo "sha256=$(cut -d' ' -f1 "${APK_FILE}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & upload APK/AAB
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: XpenseTracker v${{ steps.meta.outputs.version }} (Build ${{ steps.meta.outputs.build_code }})
          body: |
            ${{ steps.meta.outputs.notes }}

            - **Version:** `v${{ steps.meta.outputs.version }}` (versionCode `${{ steps.meta.outputs.build_code }}`)
            - **APK SHA-256:** `${{ steps.pkg.outputs.sha256 }}`
          files: |
            XpenseTracker-v${{ steps.meta.outputs.version }}.apk
            XpenseTracker-v${{ steps.meta.outputs.version }}.apk.sha256
            XpenseTracker-v${{ steps.meta.outputs.version }}.aab*
          fail_on_unmatched_files: false

      - name: Publish update metadata to Supabase app_releases
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES: ${{ steps.meta.outputs.notes }}
          MANDATORY: ${{ steps.meta.outputs.mandatory }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/XpenseTracker-v${{ steps.meta.outputs.version }}.apk
        run: |
          node <<'EOF'
          (async () => {
            const res = await fetch(process.env.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/app_releases?on_conflict=version', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': process.env.SUPABASE_SERVICE_KEY,
                'Authorization': 'Bearer ' + process.env.SUPABASE_SERVICE_KEY,
                'Prefer': 'resolution=merge-duplicates,return=representation'
              },
              body: JSON.stringify({
                version: process.env.VERSION,
                release_title: process.env.TITLE,
                release_notes: process.env.NOTES,
                update_type: 'native',
                is_mandatory: process.env.MANDATORY === 'true',
                store_url: process.env.APK_URL,
                published_at: new Date().toISOString()
              })
            });
            if (!res.ok) {
              console.error('Supabase publish failed:', res.status, await res.text());
              process.exit(1);
            }
            console.log('Published release metadata to app_releases:', await res.text());
          })();
          EOF

      - name: Write workflow summary
        run: |
          {
            echo "### XpenseTracker v${{ steps.meta.outputs.version }} Released"
            echo "- **versionCode:** ${{ steps.meta.outputs.build_code }}"
            echo "- **APK SHA-256:** \`${{ steps.pkg.outputs.sha256 }}\`"
            echo "- **Update Center URL:** https://github.com/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/XpenseTracker-v${{ steps.meta.outputs.version }}.apk"
          } >> "$GITHUB_STEP_SUMMARY"
