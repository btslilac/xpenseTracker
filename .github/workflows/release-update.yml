name: Build & Publish Android Release Update

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.3)'
        required: true
      release_title:
        description: 'Short title shown in Update Center'
        required: true
        default: 'Bug Fixes & Performance Update'
      release_notes:
        description: 'Release changelog shown to users'
        required: true
        default: 'Improved SMS transaction detection, lending sync reliability, and UI refinements.'
      is_mandatory:
        description: 'Require users to update'
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Create .env for production bundle
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Decode Android upload keystore (optional override)
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build signed Release APK
        working-directory: android
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'xpensetracker' }} \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || 'xpensetracker' }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'xpensetracker' }}

      - name: Resolve version metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TITLE="${{ inputs.release_title }}"
            NOTES="${{ inputs.release_notes }}"
            MANDATORY="${{ inputs.is_mandatory }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TITLE="XpenseTracker v${VERSION}"
            NOTES="Release v${VERSION}"
            MANDATORY="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "mandatory=$MANDATORY" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/XpenseTracker.apk "XpenseTracker-v${VERSION}.apk"

      - name: Create GitHub Release & upload APK
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: XpenseTracker v${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.notes }}
          files: XpenseTracker-v${{ steps.meta.outputs.version }}.apk

      - name: Publish update metadata to Supabase app_releases
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES: ${{ steps.meta.outputs.notes }}
          MANDATORY: ${{ steps.meta.outputs.mandatory }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/XpenseTracker-v${{ steps.meta.outputs.version }}.apk
        run: |
          node -e "
            (async () => {
              const res = await fetch(process.env.SUPABASE_URL + '/rest/v1/app_releases?on_conflict=version', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': process.env.SUPABASE_SERVICE_KEY,
                  'Authorization': 'Bearer ' + process.env.SUPABASE_SERVICE_KEY,
                  'Prefer': 'resolution=merge-duplicates,return=representation'
                },
                body: JSON.stringify({
                  version: process.env.VERSION,
                  release_title: process.env.TITLE,
                  release_notes: process.env.NOTES,
                  update_type: 'native',
                  is_mandatory: process.env.MANDATORY === 'true',
                  store_url: process.env.APK_URL,
                  published_at: new Date().toISOString()
                })
              });
              if (!res.ok) {
                console.error('Supabase publish failed:', res.status, await res.text());
                process.exit(1);
              }
              console.log('Published release metadata to app_releases:', await res.text());
            })();
          "
