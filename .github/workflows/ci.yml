name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Android manifest & compliance safety check
        run: |
          node <<'EOF'
          const fs = require('fs');
          const manifest = fs.readFileSync('android/app/src/main/AndroidManifest.xml', 'utf8');
          if (/RECORD_AUDIO|SYSTEM_ALERT_WINDOW/.test(manifest)) {
            console.error('Blocked sensitive unused permission found in main AndroidManifest.xml');
            process.exit(1);
          }
          const requiredDocs = [
            'docs/index.html',
            'docs/privacy-policy/index.html',
            'docs/terms-of-service/index.html',
            'docs/account-deletion/index.html',
            'docs/data-request/index.html',
            'docs/parental-consent/index.html'
          ];
          for (const f of requiredDocs) {
            if (!fs.existsSync(f)) {
              console.error('Missing compliance portal page:', f);
              process.exit(1);
            }
          }
          console.log('Manifest & compliance portal checks passed.');
          EOF
