// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// On Windows, keep CMake/Ninja staging directories short under android/.cxx so
// deeply nested node_modules native prefab paths stay under the 260-char MAX_PATH limit.
// Registered before root plugins because react-native rootproject evaluates :app eagerly.
if (System.getProperty("os.name").toLowerCase().contains("win")) {
  subprojects { subproject ->
    def configureShortCmakeDir = { ext ->
      def cmake = ext.externalNativeBuild?.cmake
      if (cmake != null && cmake.buildStagingDirectory == null) {
        def shortKey = subproject.path == ":app" ? "a" : "l" + Integer.toString(Math.abs(subproject.path.hashCode()) % 1000, 36)
        cmake.buildStagingDirectory = new File(rootProject.projectDir, ".cxx/${shortKey}")
      }
    }
    subproject.plugins.withId("com.android.library") {
      subproject.extensions.configure(com.android.build.api.variant.LibraryAndroidComponentsExtension) { components ->
        components.finalizeDsl { ext -> configureShortCmakeDir(ext) }
      }
    }
    subproject.plugins.withId("com.android.application") {
      subproject.extensions.configure(com.android.build.api.variant.ApplicationAndroidComponentsExtension) { components ->
        components.finalizeDsl { ext -> configureShortCmakeDir(ext) }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
